
### 2. 修改后的 page1.html（加载并渲染 Markdown）
```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人项目展示</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入Markdown解析库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 引入代码高亮库（可选，增强代码展示效果） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="auth.js"></script>
  <!-- 自定义Markdown渲染样式 -->
  <style>
    /* Markdown内容样式优化 */
    .markdown-content {
      line-height: 1.8;
    }
    .markdown-content h1 {
      font-size: 28px;
      margin: 20px 0 15px;
      color: #2c3e50;
    }
    .markdown-content h2 {
      font-size: 24px;
      margin: 18px 0 12px;
      color: #34495e;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }
    .markdown-content h3 {
      font-size: 20px;
      margin: 15px 0 10px;
      color: #34495e;
    }
    .markdown-content p {
      margin: 10px 0;
    }
    .markdown-content ul, .markdown-content ol {
      margin: 10px 0 10px 20px;
    }
    .markdown-content li {
      margin: 5px 0;
    }
    .markdown-content pre {
      background-color: #f8f8f8;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .markdown-content code {
      background-color: #f1f1f1;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .markdown-content pre code {
      background-color: transparent;
      padding: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>个人项目展示</h1>
  </header>

  <main class="protected-page">
    <!-- Markdown内容渲染容器 -->
    <div id="markdownContent" class="markdown-content"></div>
    
    <button class="btn logout-btn" onclick="auth.logout()">退出登录</button>
    <br>
    <a href="index.html" style="margin-top: 10px; display: inline-block;">返回主页</a>
  </main>

  <script>
    // 页面加载时验证登录状态
    window.onload = async function() {
      // 1. 验证登录状态
      auth.protectPage();
      
      // 2. 加载并渲染Markdown文件
      try {
        // 发起请求加载page1.md文件
        const response = await fetch('page1.md');
        if (!response.ok) {
          throw new Error('Markdown文件加载失败');
        }
        // 获取Markdown原始内容
        const markdownText = await response.text();
        
        // 配置marked解析器（启用代码高亮）
        marked.setOptions({
          highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
          },
          breaks: true, // 支持换行符
          gfm: true     // 支持GitHub Flavored Markdown
        });
        
        // 将Markdown转换为HTML并渲染到页面
        const htmlContent = marked.parse(markdownText);
        document.getElementById('markdownContent').innerHTML = htmlContent;
        
        // 手动触发代码高亮（确保所有代码块都被高亮）
        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      } catch (error) {
        document.getElementById('markdownContent').innerHTML = `
          <div style="color: #e74c3c; padding: 20px;">
            <h3>加载失败</h3>
            <p>无法加载内容：${error.message}</p>
          </div>
        `;
        console.error('Markdown加载错误:', error);
      }
    };
  </script>
</body>
</html>
