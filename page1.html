<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人项目展示</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body>
  <header>
    <h1>个人项目展示</h1>
  </header>

  <main class="protected-page">
    <h2>我的项目列表</h2>
    <ul>
      <li>项目1：Web应用开发 - 使用React+Node.js</li>
      <li>项目2：数据分析工具 - 使用Python+Pandas</li>
      <li>项目3：移动端应用 - 使用Flutter</li>
    </ul>
    
    <p>这是需要登录才能查看的受保护内容，只有验证通过的用户才能访问。</p>
    
    <button class="btn logout-btn" onclick="auth.logout()">退出登录</button>
    <br>
    <a href="index.html" style="margin-top: 10px; display: inline-block;">返回主页</a>
  </main>

  <script>
    // 页面加载时验证登录状态
    window.onload = function() {
      auth.protectPage();
    };
  </script>
</body>
</html>
